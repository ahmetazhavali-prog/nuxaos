name: Build NuxaOS ISO
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -q NuxaOS-project.zip
      - name: Build ISO
        run: |
          cd nuxaos
          chmod +x build.sh auto/* config/hooks/normal/*
          docker run --rm --privileged -v "$PWD":/work -w /work debian:bookworm ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NuxaOS-iso
          path: nuxaos/NuxaOS.iso
